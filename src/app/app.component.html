<div id="map"></div>
<img src="/assets/images/sg_logo_white.svg" alt="logo" class="logo"/>
<div class="options-card">
  <app-option-control-list [optionsList]="optionsList" (onOptionChange)="optionToggle($event)"></app-option-control-list>
</div>

@if(activePartnerNames.length && activeList.length == 1){
  <div class="names-list">
    <ul>
      @for(partner of activePartnerNames; track $index){
        <li (click)="redirect(partner)">{{ partner.name }}</li>
      }
    </ul>
  </div>
}
